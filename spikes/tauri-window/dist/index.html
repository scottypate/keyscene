<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>keyscene spike C</title>
<style>
  /* Body MUST be transparent for the transparent-window test to mean anything. */
  html, body { margin: 0; height: 100%; background: transparent; }
  #card {
    box-sizing: border-box; height: 100%;
    display: flex; flex-direction: column; justify-content: center; gap: 8px;
    padding: 24px; border-radius: 16px;
    background: rgba(24, 26, 34, 0.55);
    color: #f2f2f6; font: 15px/1.5 -apple-system, "Segoe UI", sans-serif;
    border: 1px solid rgba(255, 255, 255, 0.25);
  }
  h1 { margin: 0; font-size: 20px; }
  .chord { font-size: 44px; font-weight: 700; color: #4fc3f7; }
  small { opacity: .7 }
</style>
</head>
<body>
  <!-- data-tauri-drag-region lets the borderless window be moved -->
  <div id="card" data-tauri-drag-region>
    <h1 data-tauri-drag-region>Display-mode window probe</h1>
    <div class="chord" data-tauri-drag-region>C&sharp;m7&flat;5</div>
    <small data-tauri-drag-region>
      Everything behind this card should be your desktop, not a window
      background. Borderless, translucent, draggable by this card.
    </small>
  </div>
</body>
</html>

name: Release

# Installers are built only for version tags (v0.1.0, v1.2.3-rc1, ...).
# Push a tag, review the draft release the workflow creates, publish it.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

# The Makefile's recipes are POSIX sh; bash is the default shell on the
# macOS runner already, this makes Windows match.
defaults:
  run:
    shell: bash

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Notarization (`notarytool submit --wait`) polls Apple with no output;
    # a first submission can take an hour+. Cap it well below the 6h
    # default so a wedged submission doesn't burn macOS runner minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Installer filenames come from the app version, not the tag. Fail
      # fast if they disagree so a release never ships misnamed artifacts.
      - name: Check tag matches app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./crates/keyscene-app/tauri.conf.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match tauri.conf.json version $version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # GNU Make is preinstalled on macOS/Linux runners but not Windows.
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install -y make
      # macOS signing + notarization (tauri reads the APPLE_* env vars).
      # Only non-empty secrets are exported, so the build still works —
      # unsigned — while any secret is missing. Windows signing slots in
      # here the same way once a certificate exists.
      - name: Export signing secrets
        if: runner.os == 'macOS'
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            eval "val=\$SECRET_$v"
            if [ -n "$val" ]; then
              printf '%s<<KSEOF\n%s\nKSEOF\n' "$v" "$val" >> "$GITHUB_ENV"
            fi
          done
        env:
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # `make build` runs npm ci, builds the UI, and bundles via the
      # lockfile-pinned @tauri-apps/cli — no global CLI install needed.
      - name: Bundle
        run: make build
      - name: Attach installers to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

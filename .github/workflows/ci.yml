name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The Makefile's recipes are POSIX sh; bash is the default shell on the
# macOS/Linux runners already, this makes Windows match.
defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # GNU Make is preinstalled on macOS/Linux runners but not Windows.
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install -y make
      # Build/test ordering lives in the Makefile: the Rust targets build
      # ui/studio/dist first because tauri::generate_context! embeds it
      # at compile time.
      - name: UI typecheck + tests
        run: make test-ui
      - name: Lint
        run: make lint
      - name: Test
        run: make test-rust

  # PLAN.md Phase 1 acceptance: the WASM build of keyscene-core passes the
  # identical engine test suite (vectors + properties + fuzz).
  wasm-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Test on wasm32-wasip1
        run: make test-wasm

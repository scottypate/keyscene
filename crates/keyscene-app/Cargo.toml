[package]
name = "keyscene-app"
description = "Desktop shell backend: wires MIDI, overlay server, settings, licensing."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyscene-core = { workspace = true }
keyscene-midi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# macos-private-api: required for transparent webview windows (Spike C).
# Bars Mac App Store distribution — accepted, MAS is not in the v1 plan.
tauri = { version = "2", features = ["macos-private-api"] }

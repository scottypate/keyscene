[package]
name = "keyscene-app"
description = "Desktop shell backend: wires MIDI, overlay server, settings, licensing."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The binary is what macOS shows in the Dock / App Switcher during dev
# (no bundle, no Info.plist) — name it like the product, not the crate.
# Matches tauri.conf.json productName, which the bundler expects anyway.
[[bin]]
name = "Keyscene"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyscene-core = { workspace = true }
keyscene-midi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# macos-private-api: required for transparent webview windows (Spike C).
# Bars Mac App Store distribution — accepted, MAS is not in the v1 plan.
tauri = { version = "2", features = ["macos-private-api"] }

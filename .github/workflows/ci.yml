name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # UI first: tauri::generate_context! embeds ui/studio/dist at compile
      # time, so keyscene-app does not build without it.
      - name: UI install
        run: npm ci
        working-directory: ui
      - name: UI typecheck
        run: npm run check
        working-directory: ui
      - name: UI tests
        run: npm test
        working-directory: ui
      - name: UI build
        run: npm run build
        working-directory: ui
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  # PLAN.md Phase 1 acceptance: the WASM build of keyscene-core passes the
  # identical engine test suite (vectors + properties + fuzz).
  wasm-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Test on wasm32-wasip1
        run: cargo test -p keyscene-core --target wasm32-wasip1
